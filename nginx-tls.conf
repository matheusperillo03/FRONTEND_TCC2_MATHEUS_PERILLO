# nginx com TLS próprio (RNF01). Usado no lugar do nginx.conf quando não há um
# proxy com TLS na frente:
#   nginx -c /etc/nginx/nginx-tls.conf -g "daemon off;"
# (é o que faz o docker-compose.tls.yml do back-end). O certificado e a chave vêm
# de um volume só de leitura montado em /etc/nginx/tls; nada disso entra na imagem
# nem no repositório.
#
# nginx sem root: pid e caches em diretórios graváveis pelo usuário nginx.
pid /var/run/nginx/nginx.pid;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # O nome "api" é resolvido pela rede do Docker (serviço do back-end).
    # A variável evita que o nginx falhe ao subir sem o back-end no ar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Pedido http só é atendido quando vem da própria máquina (operador e
    # verificação de saúde do contêiner); qualquer outro vai para https.
    map $host $redirecionar_https {
        default     1;
        localhost   0;
        127.0.0.1   0;
        "[::1]"     0;
    }

    ssl_certificate     /etc/nginx/tls/servidor.crt;
    ssl_certificate_key /etc/nginx/tls/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    server {
        listen 8080;
        server_name _;
        # 308 preserva o método; a porta de fora do HTTPS é a 443.
        if ($redirecionar_https) {
            return 308 https://$host$request_uri;
        }
        # Sem TLS não há HSTS (o navegador o ignoraria: RFC 6797, 7.2).
        set $hsts "";
        include /etc/nginx/servidor-comum.conf;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        # Um ano. Sem includeSubDomains nem preload: o nome pode ser de um domínio
        # de terceiros (rede privada) que este serviço não controla.
        set $hsts "max-age=31536000";
        include /etc/nginx/servidor-comum.conf;
    }
}
