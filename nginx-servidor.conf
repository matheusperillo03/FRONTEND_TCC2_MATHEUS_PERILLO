# Corpo do `server`, igual nos dois modos: sem TLS (nginx.conf) e com TLS
# (nginx-tls.conf). Na imagem fica em /etc/nginx/servidor-comum.conf.
# Quem inclui define `listen` e a variável $hsts.
root /usr/share/nginx/html;
index index.html;

# CSP e demais cabeçalhos de segurança (ver o arquivo incluído). Vale para
# as locations sem add_header próprio: "/" e "/api/".
include /etc/nginx/cabecalhos-seguranca.conf;

# O front-end só envia JSON pequeno; o limite de /api/ fica na location.
client_max_body_size 64k;

# Verificação de saúde do contêiner (ver HEALTHCHECK no Dockerfile).
location = /saude {
    access_log off;
    default_type text/plain;
    include /etc/nginx/cabecalhos-seguranca.conf;
    return 200 "ok\n";
}

# Reverse proxy: o navegador fala só com o nginx (sem CORS).
# /api/casos -> http://api:8000/casos
location /api/ {
    # Corpo máximo aceito para a API: os corpos legítimos (criar caso,
    # iniciar coleta) têm poucos KB. Acima disso o nginx responde 413
    # sem repassar ao back-end, e a interface explica a recusa.
    client_max_body_size 64k;

    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr, e não $proxy_add_x_forwarded_for: o valor que o
    # cliente mandar em X-Forwarded-For é descartado, não repassado.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # As coletas rodam dentro da requisição e podem levar minutos. A extração de
    # editais não depende mais deste limite: o pedido responde 202 na hora e o
    # andamento é consultado em requisições curtas.
    proxy_read_timeout 300s;
}

# Assets com hash no nome podem ser cacheados por muito tempo.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Esta location usa add_header, então repete os de segurança.
    include /etc/nginx/cabecalhos-seguranca.conf;
}

# SPA: qualquer rota desconhecida cai no index.html.
location / {
    try_files $uri $uri/ /index.html;
}
