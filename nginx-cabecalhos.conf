# Cabeçalhos de segurança, num arquivo só para não divergirem.
#
# No nginx, um bloco que declara qualquer add_header deixa de herdar os do
# nível acima. Por isso este arquivo é incluído no `server` e em TODA
# `location` que usa add_header (ver nginx.conf).
#
# Content-Security-Policy:
# - script-src 'self': só os arquivos gerados pelo build; nada inline.
# - style-src 'self' + um hash: o CSS do Padrão Digital de Governo
#   (@govbr-ds/core) é empacotado como arquivo estático e não precisa de
#   'unsafe-inline'. O hash libera só o <style> fixo que o Cytoscape.js insere
#   (".__________cytoscape_container { position: relative; }"); se uma nova
#   versão do Cytoscape mudar esse texto, o navegador registra a violação e a
#   regra equivalente em src/styles.css (.grafo-canvas) mantém o grafo funcionando.
# - connect-src 'self': a API é chamada pelo mesmo servidor, em /api/. Um build
#   com VITE_API_URL apontando para outra origem exige incluir essa origem aqui.
# - img-src data: cobre ícones embutidos em CSS; não há imagem externa.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-pgvDUBa4IjFA2yuSJ2cqcyxmNYJMborsd0ORcRv9vw8='; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
# HSTS: $hsts é definido por quem inclui (nginx.conf: só quando o Host não é a
# própria máquina; nginx-tls.conf: sempre no servidor HTTPS). Com valor vazio o
# nginx não envia o cabeçalho.
add_header Strict-Transport-Security $hsts always;
