# nginx sem root: pid e caches em diretórios graváveis pelo usuário nginx.
pid /var/run/nginx/nginx.pid;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # O nome "api" é resolvido pela rede do Docker (serviço do back-end).
    # A variável evita que o nginx falhe ao subir sem o back-end no ar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # CSP e demais cabeçalhos de segurança (ver o arquivo incluído). Vale para
        # as locations sem add_header próprio: "/" e "/api/".
        include /etc/nginx/cabecalhos-seguranca.conf;

        # O front-end só envia JSON pequeno; o limite de /api/ fica na location.
        client_max_body_size 64k;

        # Verificação de saúde do contêiner (ver HEALTHCHECK no Dockerfile).
        location = /saude {
            access_log off;
            default_type text/plain;
            include /etc/nginx/cabecalhos-seguranca.conf;
            return 200 "ok\n";
        }

        # Reverse proxy: o navegador fala só com o nginx (sem CORS).
        # /api/casos -> http://api:8000/casos
        location /api/ {
            # Corpo máximo aceito para a API: os corpos legítimos (criar caso,
            # iniciar coleta) têm poucos KB. Acima disso o nginx responde 413
            # sem repassar ao back-end, e a interface explica a recusa.
            client_max_body_size 64k;

            set $api_upstream http://api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # $remote_addr, e não $proxy_add_x_forwarded_for: o valor que o
            # cliente mandar em X-Forwarded-For é descartado, não repassado.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Assets com hash no nome podem ser cacheados por muito tempo.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Esta location usa add_header, então repete os de segurança.
            include /etc/nginx/cabecalhos-seguranca.conf;
        }

        # SPA: qualquer rota desconhecida cai no index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
