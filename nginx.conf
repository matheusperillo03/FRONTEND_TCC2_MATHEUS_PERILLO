# nginx sem root: pid e caches em diretórios graváveis pelo usuário nginx.
pid /var/run/nginx/nginx.pid;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # O nome "api" é resolvido pela rede do Docker (serviço do back-end).
    # A variável evita que o nginx falhe ao subir sem o back-end no ar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Strict-Transport-Security (RFC 6797). Este arquivo não tem TLS: fora da
    # própria máquina, só se chega aqui por um proxy que termina o TLS (no piloto,
    # o Tailscale Serve, em https://<nome>.ts.net). Nesse caso o Host é o nome de
    # fora e o navegador, que está em https, recebe o cabeçalho. Em localhost o
    # valor é vazio e o nginx não envia o cabeçalho.
    map $host $hsts {
        default     "max-age=31536000";
        localhost   "";
        127.0.0.1   "";
        "[::1]"     "";
    }

    server {
        listen 8080;
        server_name _;
        include /etc/nginx/servidor-comum.conf;
    }
}
